services:
  db:
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file: .env.d/postgres.env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hgr"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    user: root
    build: .
    command: bash -c "rm -f tmp/pids/server.pid; bundle install --force --full-index; bundle lock --update; ./bin/rails server -b 0.0.0.0;"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    env_file:
      - .env.d/uids.env
      - .env.d/rails.env
      - .env.d/postgres.env
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  bundle_cache: